<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="Cyberpunk pink GitHub profile graphic">
  <defs>
    <linearGradient id="back-h" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0A0714"/>
      <stop offset="1" stop-color="#1C1030"/>
    </linearGradient>

    <linearGradient id="accent-h" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#FF4FD8"/>
      <stop offset="1" stop-color="#9E70FF"/>
    </linearGradient>

    <pattern id="grid-h" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#FF4FD8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>

    <filter id="glow-h" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'DejaVu Sans Mono', 'Courier New', monospace; }
    .sans { font-family: Inter, 'DejaVu Sans', Arial, sans-serif; }
    .cursor { animation: blink 1.1s steps(1,end) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="390" rx="21" fill="url(#back-h)"/>
  <rect width="1200" height="390" rx="21" fill="url(#grid-h)"/>
  <rect x="1" y="1" width="1198" height="388" rx="20" fill="none" stroke="#FF79E6" stroke-opacity=".38" stroke-width="2"/>

  <!-- Window controls -->
  <circle cx="72" cy="35" r="6" fill="#FF5B88"/>
  <circle cx="94" cy="35" r="6" fill="#FFD16C"/>
  <circle cx="116" cy="35" r="6" fill="#FF4FD8"/>

  <!-- Top separator -->
  <path d="M42 64H1158" stroke="#59336E" stroke-width="1"/>

  <!-- Left text block -->
  <text x="54" y="145" class="sans" font-size="30" fill="#BEA6C9" font-weight="700">HELLO, I'M</text>
  <text x="54" y="215" class="sans" font-size="68" fill="#FFF1FC" font-weight="800">AGNIESZKA</text>
  <rect x="54" y="233" width="360" height="3" rx="1.5" fill="url(#accent-h)"/>

  <text x="55" y="273" class="mono" font-size="18" fill="#FF4FD8">DATA GOVERNANCE CONSULTANT</text>
  <text x="55" y="302" class="mono" font-size="18" fill="#FF4FD8">AI DEVELOPER</text>

  <!-- Divider -->
  <path d="M673 107V324" stroke="#FF4FD8" stroke-dasharray="3 9" opacity=".22"/>

  <!-- Decorative dots -->
  <circle cx="695.0" cy="110.0" r="1.7" fill="#FF4FD8" opacity="0.15"/>
  <circle cx="701.3" cy="119.0" r="1.7" fill="#FF4FD8" opacity="0.22"/>
  <circle cx="702.8" cy="128.0" r="1.7" fill="#FF4FD8" opacity="0.30"/>
  <circle cx="698.2" cy="137.0" r="1.7" fill="#FF4FD8" opacity="0.38"/>
  <circle cx="691.2" cy="146.0" r="1.7" fill="#FF4FD8" opacity="0.15"/>
  <circle cx="687.1" cy="155.0" r="1.7" fill="#FF4FD8" opacity="0.22"/>
  <circle cx="689.1" cy="164.0" r="1.7" fill="#FF4FD8" opacity="0.30"/>
  <circle cx="695.7" cy="173.0" r="1.7" fill="#FF4FD8" opacity="0.38"/>
  <circle cx="701.7" cy="182.0" r="1.7" fill="#FF4FD8" opacity="0.15"/>
  <circle cx="702.6" cy="191.0" r="1.7" fill="#FF4FD8" opacity="0.22"/>
  <circle cx="697.6" cy="200.0" r="1.7" fill="#FF4FD8" opacity="0.30"/>
  <circle cx="690.6" cy="209.0" r="1.7" fill="#FF4FD8" opacity="0.38"/>
  <circle cx="687.0" cy="218.0" r="1.7" fill="#FF4FD8" opacity="0.15"/>
  <circle cx="689.6" cy="227.0" r="1.7" fill="#FF4FD8" opacity="0.22"/>
  <circle cx="696.4" cy="236.0" r="1.7" fill="#FF4FD8" opacity="0.30"/>
  <circle cx="702.1" cy="245.0" r="1.7" fill="#FF4FD8" opacity="0.38"/>
  <circle cx="702.3" cy="254.0" r="1.7" fill="#FF4FD8" opacity="0.15"/>
  <circle cx="696.9" cy="263.0" r="1.7" fill="#FF4FD8" opacity="0.22"/>
  <circle cx="690.0" cy="272.0" r="1.7" fill="#FF4FD8" opacity="0.30"/>
  <circle cx="687.0" cy="281.0" r="1.7" fill="#FF4FD8" opacity="0.38"/>
  <circle cx="690.2" cy="290.0" r="1.7" fill="#FF4FD8" opacity="0.15"/>
  <circle cx="697.1" cy="299.0" r="1.7" fill="#FF4FD8" opacity="0.22"/>
  <circle cx="702.4" cy="308.0" r="1.7" fill="#FF4FD8" opacity="0.30"/>

  <!-- Right terminal card -->
  <rect x="741" y="91" width="405" height="248" rx="15" fill="#120A22" stroke="#763D85" stroke-width="1.7"/>
  <rect x="741" y="91" width="405" height="37" rx="15" fill="#2E193D"/>
  <rect x="741" y="113" width="405" height="15" fill="#2E193D"/>

  <circle cx="765" cy="109" r="4" fill="#FF4FD8"/>
  <circle cx="780" cy="109" r="4" fill="#C99AFF"/>
  <text x="800" y="114" class="mono" font-size="13" fill="#FFF1FC">~/agnieszka/profile</text>

  <text x="764" y="158" class="mono" font-size="16" fill="#FF4FD8">$ whoami</text>
  <text x="780" y="183" class="mono" font-size="15" fill="#FFF1FC">&gt; data + ai explorer</text>

  <text x="764" y="222" class="mono" font-size="16" fill="#FF4FD8">$ mission --status</text>
  <text x="780" y="247" class="mono" font-size="15" fill="#FFF1FC">&gt; build with purpose</text>

  <text x="764" y="286" class="mono" font-size="16" fill="#FF4FD8">$ next_step</text>
  <text x="780" y="311" class="mono" font-size="15" fill="#FFF1FC">&gt; keep evolving</text>
  <rect x="907" y="298" width="10" height="16" fill="#FF4FD8" class="cursor"/>

  <!-- Bottom line -->
  <path d="M52 370H1148" stroke="#AB59C3" opacity=".5"/>
  <text x="54" y="382" class="mono" font-size="10" fill="#BEA6C9">SYSTEM://CYBERSPACE</text>
  <text x="1061" y="382" class="mono" font-size="10" fill="#BEA6C9">[ 01 / 03 ]</text>
</svg>
