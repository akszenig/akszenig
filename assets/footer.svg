<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="105" viewBox="0 0 1200 105" role="img" aria-label="Cyberpunk pink GitHub profile graphic">
 <defs>
 <linearGradient id="back-f" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0A0714"/><stop offset="1" stop-color="#1C1030"/></linearGradient>
 <linearGradient id="mint-f" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#FF4FD8"/><stop offset="1" stop-color="#9E70FF"/></linearGradient>
 <linearGradient id="scan-f" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FF4FD8" stop-opacity="0"/><stop offset="0.5" stop-color="#FF4FD8" stop-opacity="0.34"/><stop offset="1" stop-color="#FF4FD8" stop-opacity="0"/></linearGradient>
 <filter id="glow-f" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid-f" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FF4FD8" stroke-opacity=".055" stroke-width="1"/></pattern>
 </defs>
 <style>
  .mono {font-family:'DejaVu Sans Mono','Courier New',monospace}
  .sans {font-family:Inter,'DejaVu Sans',Arial,sans-serif}
  .scanning {animation: scan 5s ease-in-out infinite}
  .cursor {animation: blink 1.1s steps(1,end) infinite}
  .orbit {transform-origin: center; animation: rotate 22s linear infinite}
  .pulse {animation: pulse 3s ease-in-out infinite}
  @keyframes scan {0% {transform:translateY(-130px);opacity:0} 12% {opacity:1} 88% {opacity:1} 100% {transform:translateY(450px);opacity:0}}
  @keyframes blink {50% {opacity:0}}
  @keyframes rotate {to {transform:rotate(360deg)}}
  @keyframes pulse {50% {opacity:.35}}
  @media (prefers-reduced-motion:reduce) {.scanning,.cursor,.orbit,.pulse {animation:none}}
 </style>
 <rect width="1200" height="105" rx="21" fill="url(#back-f)"/>
 <rect width="1200" height="105" rx="21" fill="url(#grid-f)"/>
 <rect x="1" y="1" width="1198" height="103" rx="20" fill="none" stroke="#FF79E6" stroke-opacity=".38" stroke-width="2"/>
<path d="M38 24H1162" stroke="#59336E"/>
<circle cx="75" cy="56" r="5" fill="#FF4FD8" class="pulse"/>
<text x="97" y="62" class="mono" font-size="18" fill="#FFF1FC" font-weight="bold" >EOF  //  THANKS FOR VISITING</text><text x="1012" y="62" class="mono" font-size="12" fill="#FF4FD8" font-weight="normal" >STAY CURIOUS _</text><text x="45" y="90" class="mono" font-size="10" fill="#BEA6C9" font-weight="normal" >POWERED BY CURIOSITY</text></svg>
